# 鑷寘鍚厤缃細浠讳綍鐜涓嬪湪鏈粨搴撳唴鐩存帴杩愯 ruff/pytest 鍙ｅ緞涓€鑷淬€?

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worlditor-mcp"
version = "0.1.11"
description = "涓€琛屽懡浠ら儴缃茬殑涓栫晫鏈嶅姟锛歁CP 涓栫晫锛堜换鎰?agent 妗嗘灦鍙帴鍏ワ級+ 鑷甫 WebUI锛堢櫥褰?娓哥帺/绠＄悊锛?
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Rail1bc" }]
keywords = ["mcp", "world", "agent", "game"]
dependencies = [
    "aiosqlite",
    "mcp>=1.28,<2",  # 2.x 閲嶆瀯鍒犻櫎浜?mcp.server.fastmcp锛岄攣瀹?1.x 绾?
    "pyyaml",
    "starlette",
    "tzdata",  # zoneinfo 鏃跺尯鏁版嵁锛歐indows 蹇呰锛泂lim 瀹瑰櫒鍚屾牱缂虹郴缁熸椂鍖?
    "uvicorn",
]

[project.scripts]
worlditor = "worlditor_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "httpx",  # starlette TestClient锛圕I 鍚屾锛?
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["worlditor_mcp"]
# WebUI 鏋勫缓浜х墿鎵撹繘 wheel锛坧ip 瀹夎鍦烘櫙涔熸湁鐣岄潰锛涙暣浣?~150KB锛?
[tool.hatch.build.targets.wheel.force-include]
"webui/dist" = "worlditor_mcp/webui_dist"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"  # 涓?requires-python >=3.10 瀵归綈

[tool.ruff.lint]
select = ["F", "W", "E", "ASYNC", "C4", "Q", "I", "UP"]
ignore = ["F403", "F405", "E501", "ASYNC230", "ASYNC240"]
