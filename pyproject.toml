# worlditor-mcp：一行命令部署的世界服务（MCP 为第一公民协议）。
# 自包含配置：任何环境下在本仓库内直接运行 ruff/pytest 口径一致。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worlditor-mcp"
version = "0.1.0"
description = "一行命令部署的世界服务：MCP 世界（任意 agent 框架可接入）+ 自带 WebUI（登录/游玩/管理）"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Rail1bc" }]
keywords = ["mcp", "world", "agent", "game"]
dependencies = [
    "aiosqlite",
    "mcp>=1.28",
    "starlette",
    "uvicorn",
]

[project.scripts]
worlditor = "worlditor_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["worlditor_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["F", "W", "E", "ASYNC", "C4", "Q", "I", "UP"]
ignore = ["F403", "F405", "E501", "ASYNC230", "ASYNC240"]
